server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    # Do not expose source maps, private dotfiles, or source/config directories.
    # Keep .well-known available for certificate and site verification.
    location ~* \.map$ {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* ^/(?:src|shared|node_modules|apps)(?:/|$) {
        return 404;
    }

    location ~* ^/(?:package(?:-lock)?\.json|vite\.config\.[^/]+|Dockerfile(?:\.[^/]+)?|docker-compose\.ya?ml|nginx\.conf|deploy\.sh)$ {
        return 404;
    }

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;

    # Proxy REST API requests to Node.js backend
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Proxy Dynamic XML Sitemaps and robots.txt to Node.js backend
    location ~ ^/(sitemap.*\.xml|robots\.txt)$ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets long-term caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Single Page Application (SPA) routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Point static.anidoki.com to this server and terminate HTTPS at your proxy/CDN.
server {
    listen 80;
    server_name static.anidoki.com;

    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    # Module scripts loaded by anidoki.com require cross-origin access.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* \.map$ { return 404; }
    location ~ /\. { return 404; }
    location ~* ^/(?:src|shared|node_modules|apps|api)(?:/|$) { return 404; }
    location ~* ^/(?:package(?:-lock)?\.json|vite\.config\.[^/]+|Dockerfile(?:\.[^/]+)?|docker-compose\.ya?ml|nginx\.conf|deploy\.sh)$ { return 404; }
    location = / { return 404; }
    location = /index.html { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Public files are not hashed, so revalidate after each deployment.
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
